name: Build packages
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yaml'
      - 'scripts/package_release.py'
      - 'scripts/test_package_release.py'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version
        run: test "$(go run . --version)" = "v1.2.0"
      - name: Build and package
        run: python scripts/package_release.py build ${{ matrix.goos }} ${{ matrix.goarch }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: agevault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
  checksums:
    name: Verify packages and checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate all six packages and generate SHA-256 manifest
        run: python scripts/package_release.py checksums dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
